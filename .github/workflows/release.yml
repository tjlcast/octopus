name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.X.X, got: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store path
        id: pnpm-cache
        shell: bash
        run: echo "store_path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store_path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(
            git tag --sort=-version:refname \
              | awk -v cur="${CURRENT_TAG}" '$0 == cur { getline; print; exit }'
          )"

          {
            echo "## Changelog"
            echo
            if [[ -n "${PREV_TAG}" ]]; then
              echo "Compare: \`${PREV_TAG}\` -> \`${CURRENT_TAG}\`"
              echo
              git log --pretty=format:'- %s (%h)' "${PREV_TAG}..${CURRENT_TAG}"
            else
              echo "First release"
              echo
              git log --pretty=format:'- %s (%h)' "${CURRENT_TAG}"
            fi
            echo
          } > release-notes.md

          cat release-notes.md

      - name: Build and export Docker image
        shell: bash
        env:
          IMAGE_NAME: jialtang/octopus
          IMAGE_TAG: ${{ github.ref_name }}
          VERSION: ${{ github.ref_name }}
          TARGET_PLATFORM: linux/amd64
          EXPORT_IMAGE: 'true'
          ASSET_NAME: Docker-jialtang-octopus-${{ github.ref_name }}.tar.gz
        run: |
          set -euo pipefail

          chmod +x scripts/build-docker.sh
          scripts/build-docker.sh

      - name: Install makeself
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y makeself

      - name: Package self-extracting installer
        shell: bash
        env:
          ASSET_NAME: Docker-jialtang-octopus-${{ github.ref_name }}.tar.gz
          INSTALLER_NAME: octopus-${{ github.ref_name }}-install.run
        run: |
          set -euo pipefail

          image_tar="${ASSET_NAME%.gz}"

          # 解压出裸 .tar 供 makeself 打包，同时保留 .tar.gz 用于发布
          gzip -dkf "${ASSET_NAME}"

          rm -rf payload
          mkdir -p payload
          cp scripts/installer.sh payload/installer.sh
          chmod +x payload/installer.sh
          mv "${image_tar}" payload/

          makeself payload/ "${INSTALLER_NAME}" "Octopus Deploy Installer" ./installer.sh

          ls -lh "${INSTALLER_NAME}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: octopus ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            Docker-jialtang-octopus-${{ github.ref_name }}.tar.gz
            octopus-${{ github.ref_name }}-install.run
          draft: false
          prerelease: false
